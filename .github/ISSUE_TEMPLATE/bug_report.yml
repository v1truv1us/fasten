name: Bug Report
description: Report a bug in Fasten
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Fasten!
  - type: input
    id: version
    attributes:
      label: Zig Version
  - type: textarea
    id: description
    attributes:
      label: Bug Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input File
      description: Example JS file that triggers the bug
      render: javascript
